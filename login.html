<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./login.css" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Login page</title>
</head>
<body>
    <!---------------------overall screen--------------------------->
    <div class="overall">
        <!-----------------------------container--------------------------->
        <div class="container">
            <div class="left">
                <!--------------------back icon-------------->
                <div class="back">
                <button>
                    <a href="./index.html"><i class="fa-solid fa-arrow-left"></i></a>
                </button>    
                </div>
                <!-------------------logo------------------------>
                <div class="cont">
                <div class="logo">
                    <img src="./Frame 62.png"/>
                </div>
                <!------------------------content----------------------->
                <div class="hcont">
                     <!------------title---------------------->
                    <h1>Craft Your <span>Career.</span></h1>
                    <h1>Create Your <span>Future.</span></h1>
                    <!--------------content------------------------>
                    <p class="par">An AI career copilot for students, graduates and switchers - from resume to offer letter..</p>
                </div>
                <!------------------------image---------------------------------->
                <div class="boy">
                    <img src="./ChatGPT Image Aug 4, 2026, 09_44_42 AM 1.png"/>
                    
                </div>
                </div>
            </div>
            <!------------------------------------right section---------------->
            <div class="right">
                <!---------------------form--------------------->
                <form>
                    <div class="title">
                    <h1>Welcome Back👋</h1>
                    <h3>Login to continue your career journey</h3>
                    </div>
                    <div class="email">
                        <label><h3>Email Address</h3></label>
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" placeholder="Enter your email"/>
                    </div>
                    <div class="pass">
                        <label><h3>Password</h3></label>
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Enter your password"/>
                    </div>
                    <p class="for">Forgot password?</p>
                    <button class="log">
                        <div class="glow"></div><p>Login</p></button>
                    <div class="or">
                        <div></div>
                        <span>or continue with</span>
                        <div></div>
                    </div>
                    <div class="goo">
                        <button><i class="fa-brands fa-google"></i>Google</button>
                        <button><i class="fa-brands fa-facebook-f"></i>Facebook</button>
                    </div>
                    <p class="acc">Dont't have an account?<span>Sign in</span></p>
                </form>
                <p class="cp"><i class="fa-regular fa-copyright"></i> 2026 CareerCraft AI. All rights reserved</p>
            </div>

        </div>
        

    </div>
    
</body>
</html>
